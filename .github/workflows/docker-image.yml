# Image Docker publiée sur GHCR à chaque release (tag X.Y.Z) : ghcr.io/<dépôt>:X.Y.Z, X.Y et X.
# Les versions sont déployées par Renovate depuis sea-of-thieves-france/infra ; pas de tag latest.
# Republier une version : Actions → ce workflow → Run workflow, avec le tag.
name: Image

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag à publier (X.Y.Z)
        required: true

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TAG: ${{ inputs.tag || github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.TAG }}

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}},value=${{ env.TAG }}
            type=semver,pattern={{major}}.{{minor}},value=${{ env.TAG }}
            type=semver,pattern={{major}},value=${{ env.TAG }}
          flavor: latest=false

      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
